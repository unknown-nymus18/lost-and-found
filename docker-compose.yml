services:
  postgres:
    image: postgres:17-alpine
    container_name: campus-lost-found-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_lost_found
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - campus_lost_found_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_lost_found"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campus_lost_found_postgres_data:
